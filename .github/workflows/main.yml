
name: Extract and Build Flutter APK + AAB

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract ZIP files recursively
        id: locate
        shell: bash
        run: |
          python3 <<'PY'
          import os, shutil, zipfile
          from pathlib import Path

          repo = Path.cwd()
          output = repo / ".ci-unpacked"

          if output.exists():
              shutil.rmtree(output)
          output.mkdir()

          queue = [
              p for p in repo.rglob("*.zip")
              if output not in p.parents and ".git" not in p.parts
          ]

          seen = set()
          index = 0

          while queue:
              archive = queue.pop(0)
              if str(archive.resolve()) in seen:
                  continue
              seen.add(str(archive.resolve()))

              index += 1
              dest = output / f"archive_{index}"
              dest.mkdir()

              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      target = (dest / item.filename).resolve()
                      if not target.is_relative_to(dest.resolve()):
                          raise RuntimeError("Unsafe ZIP path")
                  z.extractall(dest)

              queue.extend(dest.rglob("*.zip"))

          candidates = []
          for base in (repo, output):
              for p in base.rglob("pubspec.yaml"):
                  if ".git" in p.parts:
                      continue
                  root = p.parent
                  if ((root / "lib/main.dart").is_file()
                      and (root / "android").is_dir()):
                      candidates.append(root.resolve())

          candidates = sorted(set(candidates),
                              key=lambda p: (len(p.parts), str(p)))

          if not candidates:
              raise SystemExit("Flutter project not found!")

          project = candidates[0]
          print("Flutter project:", project)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"project_dir={project}\n")
          PY

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: Generate app icons
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: dart run flutter_launcher_icons

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter build apk --release

      - name: Build AAB
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter build appbundle --release

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: matbakhy-android-release
          path: |
            ${{ steps.locate.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ steps.locate.outputs.project_dir }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

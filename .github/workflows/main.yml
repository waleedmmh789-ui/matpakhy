name: Build Flutter App

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Extract zip archives if present
        run: |
          find . -maxdepth 3 -type f -name "*.zip" | while read -r zipfile; do
            target_dir="${zipfile%.zip}"
            mkdir -p "$target_dir"
            unzip -q -o "$zipfile" -d "$target_dir" || true
          done

      - name: Locate Flutter project root
        id: locate_project
        run: |
          PUBSPEC_PATH=$(find . -maxdepth 5 -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "❌ لم يتم العثور على ملف pubspec.yaml داخل المشروع!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found Flutter project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: flutter pub get

      - name: Disable Lint Check (Fix for LintDetectorError)
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i '/lint {/a \        abortOnError false\n        checkReleaseBuilds false' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/lint {/a \        abortOnError = false\n        checkReleaseBuilds = false' android/app/build.gradle.kts || true
          fi

      - name: Build APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.locate_project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk

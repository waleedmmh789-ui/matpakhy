name: Build APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        working-directory: .
        run: |
          mkdir -p app
          ZIP=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Unzipping $ZIP"
            unzip -q -o "$ZIP" -d _unz
            PUBSPEC=$(find _unz -name pubspec.yaml | head -n1)
            DIR=$(dirname "$PUBSPEC")
            cp -a "$DIR"/. app/
          else
            find . -maxdepth 1 -mindepth 1 ! -name app ! -name .git -exec cp -a {} app/ \;
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project (modern Gradle)
        run: |
          # نشيل ملفات Gradle القديمة ونخلي Flutter يولد الحديثة
          rm -f android/settings.gradle android/build.gradle android/app/build.gradle \
                android/gradle.properties android/gradle/wrapper/gradle-wrapper.properties
          flutter create --platforms=android --org com.matbakhy --project-name cooking_app .
          rm -f test/widget_test.dart
          rm -rf android/app/src/main/kotlin/com/matbakhy/cooking_app

      - name: Patch build.gradle.kts (SDK, signing, desugaring)
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          s = 'import java.io.FileInputStream\nimport java.util.Properties\n\n' + s
          s = re.sub(r'namespace\s*=\s*"[^"]*"', 'namespace = "com.matbakhy.cooking"', s)
          s = re.sub(r'applicationId\s*=\s*"[^"]*"', 'applicationId = "com.matbakhy.cooking"', s)
          s = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 26', s)
          s = re.sub(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 35', s)
          s = re.sub(r'(compileOptions\s*\{)', r'\1\n        isCoreLibraryDesugaringEnabled = true', s, count=1)
          keystore = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''.replace('          ', '')
          s = s.replace('android {', keystore + 'android {', 1)
          signing = '''signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = (keystoreProperties["storeFile"] as String?)?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String?
                  }
              }

              '''
          s = s.replace('buildTypes {', signing + 'buildTypes {', 1)
          s = re.sub(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                     'signingConfig = signingConfigs.getByName("release")', s)
          if 'coreLibraryDesugaring' not in s:
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "minSdk\|targetSdk\|namespace\|applicationId\|Desugaring\|signingConfig" android/app/build.gradle.kts

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            SP="$KEYSTORE_PASSWORD"; KA="$KEY_ALIAS"; KP="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::No keystore secrets, generating a temporary one"
            SP="matbakhy123456"; KA="upload"; KP="matbakhy123456"
            keytool -genkeypair -v -keystore android/app/upload-keystore.jks \
              -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias "$KA" \
              -storepass "$SP" -keypass "$KP" -dname "CN=Matbakhy, O=Matbakhy, C=EG"
          fi
          {
            echo "storePassword=$SP"
            echo "keyPassword=$KP"
            echo "keyAlias=$KA"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/matbakhy.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/matbakhy.aab

      - uses: actions/upload-artifact@v4
        with:
          name: matbakhy-release
          path: app/dist/*
